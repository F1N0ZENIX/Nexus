name: Nexus Ai Android APK and Releases

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=Nexus AI release $VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Sign with persistent release key when configured
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          VERSION="${{ steps.version.outputs.version }}"
          APK_NAME="Nexus AI release ${VERSION}.apk"
          if [ -n "$NEXUS_KEYSTORE_BASE64" ] && [ -n "$NEXUS_KEYSTORE_PASSWORD" ] && [ -n "$NEXUS_KEY_ALIAS" ] && [ -n "$NEXUS_KEY_PASSWORD" ]; then
            echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > nexus-release.jks
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks nexus-release.jks --ks-key-alias "$NEXUS_KEY_ALIAS" --ks-pass env:NEXUS_KEYSTORE_PASSWORD --key-pass env:NEXUS_KEY_PASSWORD --out "$APK_NAME" "$APK"
            "$APKSIGNER" verify "$APK_NAME"
            echo "Persistent release signature applied."
          else
            cp "$APK" "$APK_NAME"
            echo "::warning::Release secrets are not configured; this debug-signed APK may not install over a previous build."
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-AI-release-${{ steps.version.outputs.version }}
          path: "${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexus Ai release ${{ steps.version.outputs.version }}
          body: |
            Release automática do Nexus AI.
            - Versão ${{ steps.version.outputs.version }}
            - APK: Nexus AI release ${{ steps.version.outputs.version }}.apk
            - Ícone nativo do aplicativo
            - Histórico local; sem API Kimi integrada
            - Alternativa local Qwen3 4B e gerenciamento de modelos Ollama
            Para atualizações por cima, configure uma chave de assinatura persistente nos Secrets do repositório.
          files: "${{ steps.version.outputs.apk_name }}"
          fail_on_unmatched_files: true
          make_latest: true
