<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Groq</title>
    <style>
        /* Reset e Fonte */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* MODO CELULAR */
        .phone {
            width: 380px;
            height: 780px;
            background-color: #111;
            border: 5px solid #333;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* MODO PC (Tela cheia) */
        @media (min-width: 1024px) {
            body { background-color: #0a0a0a; }
            .phone {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                display: grid;
                grid-template-columns: 280px 1fr;
            }

            .mobile-only { display: none !important; }

            .pc-layout {
                display: flex !important;
                flex-direction: column;
                height: 100%;
                background-color: #1a1a1a;
                border-right: 1px solid #333;
            }
            
            .pc-chat-area {
                grid-column: 2;
                display: flex !important;
                flex-direction: column;
                height: 100%;
                background-color: #111;
            }
        }

        /* Layout Mobile padrão */
        .pc-layout { display: none; }
        .screen { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; flex-direction: column; background-color: #111; }
        .screen.active { display: flex; }

        /* CSS Comum */
        header { padding: 30px 20px 10px; }
        .logo { color: #ccc; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .icon-logo { font-size: 32px; color: #5e5ce6; transform: rotate(-45deg); }
        .ai-text { color: #5e5ce6; }

        .chat-area { flex: 1; background-color: #222; margin: 0 15px; border-radius: 20px; padding: 20px; color: #aaa; font-size: 15px; overflow-y: auto; border: 1px solid #333; display: flex; flex-direction: column; }
        
        .input-area { padding: 15px; }
        .input-box { background-color: #222; border-radius: 30px; display: flex; align-items: center; padding: 5px 10px; border: 1px solid #333; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 15px; }
        .btn-icon, .btn-send { background: transparent; border: none; color: #5e5ce6; font-size: 22px; cursor: pointer; padding: 0 10px; }

        /* Menus */
        .menu-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 10px; padding: 30px 20px; overflow-y: auto; }
        .menu-title { color: white; font-size: 18px; margin-bottom: 20px; text-align: center; }
        
        .menu-btn { background-color: #333; color: #ddd; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; text-align: center; }
        .menu-btn:hover, .menu-btn.active { background-color: #5e5ce6; color: white; }
        
        /* Botões */
        .back-btn { position: absolute; bottom: 20px; right: 20px; background: transparent; border: 2px solid #5e5ce6; border-radius: 50%; width: 40px; height: 40px; color: #5e5ce6; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transform: rotate(-90deg); z-index: 10; }
        
        .input-chave { background-color: #333; border: none; padding: 15px; border-radius: 10px; color: white; width: 100%; text-align: center; outline: none; font-size: 14px; letter-spacing: 1px; margin-bottom: 15px; }
        
        /* Mensagens (CORRIGIDO) */
        .msg { margin-bottom: 15px; max-width: 95%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .msg.user { color: #7b79ff; text-align: right; margin-left: auto; }
        .msg.bot { color: #aaa; text-align: left; margin-right: auto; width: 100%; max-width: 100%; }
        .msg.thinking { color: #555; font-style: italic; }

        /* Bloco de Código */
        .code-block {
            position: relative;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            overflow-x: auto; /* Permite rolagem horizontal */
            max-height: 300px; /* Limita a altura */
            overflow-y: auto;
        }
        
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: #888;
            font-weight: bold;
        }

        .copy-btn {
            background-color: #333;
            color: #ccc;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .copy-btn:hover { background-color: #5e5ce6; color: white; }
        .copy-btn.copied { background-color: #28a745; color: white; }

        pre {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            color: #e0e0e0;
            white-space: pre; /* Mantém indentação */
        }

        /* Histórico de Chats */
        .chat-history-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #333; color: white; font-weight: bold; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background-color: #222; border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; color: #ddd; font-size: 14px; border: 1px solid transparent; transition: 0.2s; }
        .history-item:hover { background-color: #333; }
        .history-item.active { border-color: #5e5ce6; background-color: #2a2a4a; }
        .history-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
        .history-item-actions button { background: transparent; border: none; color: #888; cursor: pointer; margin-left: 5px; font-size: 14px; }
        .history-item-actions button:hover { color: #ff5e5e; }

        .new-chat-btn { background-color: #5e5ce6; color: white; border: none; padding: 12px; width: calc(100% - 20px); margin: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .new-chat-btn:hover { background-color: #4b49c4; }

        .danger-btn { background-color: #dc3545; color: white; border: none; padding: 15px; width: calc(100% - 20px); margin: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .danger-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="phone">
        
        <!-- BARRA LATERAL (PC) -->
        <div class="pc-layout">
            <header style="border-bottom: 1px solid #333;">
                <div class="logo">
                    <span class="icon-logo">⌃</span> NEXUS <span class="ai-text">AI</span>
                </div>
            </header>
            
            <div class="chat-history-header"><span>Conversas</span></div>
            <button class="new-chat-btn" onclick="createNewChat()">+ Nova Conversa</button>
            <div class="history-list" id="pc-history-list"></div>

            <div style="padding: 15px; border-top: 1px solid #333;">
                <button class="menu-btn" onclick="openPcMenu('key')" style="margin-bottom: 5px;">🔑 Configurar Chave</button>
                <button class="menu-btn" onclick="openPcMenu('models')">🧠 Escolher Modelo</button>
                <button class="danger-btn" onclick="clearAllData()" style="margin-top: 10px;">🗑️ Apagar Dados</button>
            </div>

            <div id="pc-menu-content" style="width: 100%; padding: 10px; display: none; background:#222;"></div>
        </div>

        <!-- ÁREA DO CHAT -->
        <div class="pc-chat-area">
            <header class="mobile-only">
                <div class="logo">
                    <span class="icon-logo">⌃</span> NEXUS <span class="ai-text">AI</span>
                </div>
            </header>

            <div id="screen-chat" class="screen active" style="position: relative; height: 100%; display: flex; flex-direction: column;">
                <main class="chat-area" id="chat-area" style="margin: 0 15px;"></main>
                <footer class="input-area">
                    <div class="input-box">
                        <button class="btn-icon mobile-only" id="menu-btn" onclick="goToScreen('screen-menu')">☰</button>
                        <input type="text" id="user-input" placeholder="digite algo">
                        <button class="btn-send" onclick="sendMessage()">↑</button>
                    </div>
                </footer>
            </div>

            <div id="screen-menu" class="screen mobile-only">
                <div class="chat-history-header"><span>Conversas</span></div>
                <button class="new-chat-btn" onclick="createNewChat()">+ Nova Conversa</button>
                <div class="history-list" id="mobile-history-list"></div>
                <div style="padding: 15px; border-top: 1px solid #333;">
                    <button class="menu-btn" onclick="goToScreen('screen-key')" style="margin-bottom: 5px;">🔑 Chave API</button>
                    <button class="menu-btn" onclick="goToScreen('screen-models')">🧠 Mudar Modelo</button>
                    <button class="danger-btn" onclick="clearAllData()" style="margin-top: 10px;">🗑️ Apagar Dados</button>
                </div>
                <button class="back-btn" onclick="goToScreen('screen-chat')">⌃</button>
            </div>

            <div id="screen-models" class="screen mobile-only">
                <div class="menu-container">
                    <h3 class="menu-title">Selecione o Modelo</h3>
                    <div id="mobile-model-list"></div>
                </div>
                <button class="back-btn" onclick="goToScreen('screen-menu')">⌃</button>
            </div>

            <div id="screen-key" class="screen mobile-only">
                <div class="menu-container">
                    <h3 class="menu-title">Insira sua Chave Groq</h3>
                    <input type="password" id="api-key-input" class="input-chave" placeholder="gsk_...">
                    <button class="menu-btn" onclick="saveKey()">Salvar</button>
                    <p id="status-key" style="color: #5e5ce6; font-size: 12px; text-align: center;"></p>
                </div>
                <button class="back-btn" onclick="goToScreen('screen-menu')">⌃</button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://api.groq.com/openai/v1/chat/completions";
        let apiKey = localStorage.getItem('groq_api_key') || '';
        
        const MODELS = [
            { id: 'openai/gpt-oss-20b', name: 'OpenAI GPT-OSS 20B' },
            { id: 'openai/gpt-oss-120b', name: 'OpenAI GPT-OSS 120B' },
            { id: 'moonshotai/kimi-k2-instruct', name: 'Kimi K2 Instruct' },
            { id: 'qwen/qwen3-32b', name: 'Qwen 3 32B' },
            { id: 'deepseek-r1-distill-qwen-32b', name: 'DeepSeek R1 Qwen 32B' },
            { id: 'mixtral-8x7b-32768', name: 'Mixtral 8x7B' },
            { id: 'gemma2-9b-it', name: 'Gemma 2 9B' }
        ];

        let chats = JSON.parse(localStorage.getItem('nexus_chats')) || [];
        let currentChatId = localStorage.getItem('nexus_current_chat') || null;
        let currentModel = 'openai/gpt-oss-20b';

        // *** FUNÇÃO CORRIGIDA PARA RENDERIZAR CÓDIGO ***
        function renderMessageContent(content, type) {
            // Divide o conteúdo em partes de texto e blocos de código
            const parts = content.split(/(```[\s\S]*?```)/g);
            
            const container = document.createElement('div');
            container.style.width = '100%';

            parts.forEach(part => {
                if (part.startsWith('```') && part.endsWith('```')) {
                    // Identifica a linguagem
                    const firstLineEnd = part.indexOf('\n');
                    const lang = part.substring(3, firstLineEnd).trim() || 'code';
                    const code = part.substring(firstLineEnd + 1, part.length - 3);

                    // Cria o bloco de código estilizado
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-block';
                    
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    header.innerHTML = `<span>${lang}</span>`;
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.innerText = 'Copiar';
                    copyBtn.onclick = async () => {
                        try {
                            await navigator.clipboard.writeText(code);
                            copyBtn.innerText = 'Copiado!';
                            copyBtn.classList.add('copied');
                            setTimeout(() => { copyBtn.innerText = 'Copiar'; copyBtn.classList.remove('copied'); }, 2000);
                        } catch (e) { alert('Erro ao copiar'); }
                    };
                    header.appendChild(copyBtn);

                    const pre = document.createElement('pre');
                    pre.textContent = code; // Usa textContent para não quebrar HTML

                    codeBlock.appendChild(header);
                    codeBlock.appendChild(pre);
                    container.appendChild(codeBlock);
                } else {
                    // Texto normal
                    const textDiv = document.createElement('div');
                    textDiv.style.whiteSpace = 'pre-wrap';
                    textDiv.textContent = part;
                    container.appendChild(textDiv);
                }
            });

            return container;
        }

        // *** FUNÇÃO ADICIONAR MENSAGEM ATUALIZADA ***
        function addMessage(content, type, fromHistory = false) {
            const chatArea = document.getElementById('chat-area');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + type;
            
            if (type === 'bot') {
                msgDiv.appendChild(renderMessageContent(content, type));
            } else {
                msgDiv.textContent = content;
            }

            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgDiv;
        }

        // *** RESTANTE DA LÓGICA (SEM ALTERAÇÕES) ***
        function initializeChats() {
            if (chats.length === 0 || !currentChatId) createNewChat();
            else { loadChat(currentChatId); renderHistory(); }
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: "Nova Conversa", model: 'openai/gpt-oss-20b', messages: [] };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveChats();
            loadChat(currentChatId);
            renderHistory();
        }

        function saveChats() {
            localStorage.setItem('nexus_chats', JSON.stringify(chats));
            localStorage.setItem('nexus_current_chat', currentChatId);
        }

        function loadChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chatId;
            currentModel = chat.model;
            const chatArea = document.getElementById('chat-area');
            chatArea.innerHTML = ''; 
            chat.messages.forEach(msg => addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot'));
            if (chat.messages.length === 0) addMessage("Olá, eu sou a Nexus, como posso ajudar?", 'bot');
            updateStatus();
            renderHistory(); 
        }

        function renderHistory() {
            const lists = [document.getElementById('mobile-history-list'), document.getElementById('pc-history-list')];
            lists.forEach(list => {
                if (!list) return;
                list.innerHTML = '';
                chats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
                    item.innerHTML = `<div class="history-item-title" ondblclick="renameChat('${chat.id}', this)">${chat.title}</div><div class="history-item-actions"><button onclick="deleteChat('${chat.id}')">🗑️</button></div>`;
                    item.onclick = (e) => { if (e.target.tagName !== 'BUTTON') loadChat(chat.id); };
                    list.appendChild(item);
                });
            });
        }

        function renameChat(chatId, element) {
            const newTitle = prompt("Renomear conversa:", element.innerText);
            if (newTitle) { const chat = chats.find(c => c.id === chatId); chat.title = newTitle; saveChats(); renderHistory(); }
        }

        function deleteChat(chatId) {
            if (confirm("Excluir esta conversa?")) {
                chats = chats.filter(c => c.id !== chatId);
                if (currentChatId === chatId) loadChat(chats.length > 0 ? chats[0].id : createNewChat().id);
                saveChats();
            }
        }

        function clearAllData() {
            if (confirm("Apagar TODOS os dados?")) { localStorage.clear(); location.reload(); }
        }

        const menuBtn = document.getElementById('menu-btn');
        menuBtn.addEventListener('dblclick', function(e) { e.preventDefault(); window.close(); setTimeout(() => alert("Navegador bloqueou. Feche manualmente."), 100); });

        function goToScreen(screenId) {
            document.querySelectorAll('.screen.mobile-only').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openPcMenu(type) {
            const content = document.getElementById('pc-menu-content');
            content.style.display = 'block'; content.innerHTML = ''; 
            if (type === 'key') content.innerHTML = `<p style="color: white; text-align: center; margin-bottom: 10px;">Chave API</p><input type="password" id="pc-api-key" class="input-chave" placeholder="gsk_..." value="${apiKey}"><button class="menu-btn" onclick="savePcKey()">Salvar</button>`;
            else if (type === 'models') {
                content.innerHTML = `<p style="color: white; text-align: center; margin-bottom: 10px;">Modelos</p>`;
                MODELS.forEach(model => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-btn' + (currentModel === model.id ? ' active' : '');
                    btn.innerText = model.name; btn.style.marginBottom = '5px';
                    btn.onclick = () => setModel(model.id);
                    content.appendChild(btn);
                });
            }
        }

        function saveKey() {
            const input = document.getElementById('api-key-input').value.trim();
            if (input) { apiKey = input; localStorage.setItem('groq_api_key', apiKey); document.getElementById('status-key').innerText = "Chave salva!"; setTimeout(() => goToScreen('screen-chat'), 800); }
            else { document.getElementById('status-key').innerText = "Chave inválida."; document.getElementById('status-key').style.color = "red"; }
        }

        function savePcKey() {
            const input = document.getElementById('pc-api-key').value.trim();
            if (input) { apiKey = input; localStorage.setItem('groq_api_key', apiKey); alert("Chave salva!"); } else alert("Chave inválida!");
        }

        function setModel(modelId) {
            currentModel = modelId;
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) { chat.model = modelId; saveChats(); }
            updateStatus();
            if (window.innerWidth < 1024) goToScreen('screen-chat'); else openPcMenu('models'); 
        }

        function updateStatus() {
            const status = document.getElementById('status-model');
            if (status) status.innerText = "Modelo: " + currentModel;
            if (window.innerWidth >= 1024) document.querySelectorAll('#pc-menu-content .menu-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.includes(currentModel)));
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const userText = input.value.trim();
            if (!userText) return;
            if (!apiKey) { alert("Configure sua Chave Groq!"); if (window.innerWidth < 1024) goToScreen('screen-key'); else openPcMenu('key'); return; }

            input.value = '';
            addMessage(userText, 'user');

            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({ role: 'user', content: userText });
                if (chat.title === "Nova Conversa") chat.title = userText.substring(0, 30) + (userText.length > 30 ? "..." : "");
                saveChats(); renderHistory();
            }

            const thinkingMsg = addMessage('Digitando...', 'bot thinking');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: currentModel, messages: chat.messages })
                });

                if (!response.ok) throw new Error((await response.json()).error.message || "Erro na API");

                const data = await response.json();
                const botReply = data.choices[0].message.content;

                // Remove o "Digitando..." e insere o conteúdo correto
                thinkingMsg.classList.remove('thinking');
                thinkingMsg.innerHTML = '';
                thinkingMsg.appendChild(renderMessageContent(botReply, 'bot'));

                if (chat) { chat.messages.push({ role: 'assistant', content: botReply }); saveChats(); renderHistory(); }

            } catch (error) {
                thinkingMsg.classList.remove('thinking');
                thinkingMsg.style.color = 'red';
                thinkingMsg.innerText = "Erro: " + error.message;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });

        const mobileList = document.getElementById('mobile-model-list');
        MODELS.forEach(model => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn' + (currentModel === model.id ? ' active' : '');
            btn.innerText = model.name; btn.style.marginBottom = '5px';
            btn.onclick = () => { setModel(model.id); document.querySelectorAll('#mobile-model-list .menu-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
            mobileList.appendChild(btn);
        });

        initializeChats();
        updateStatus();
    </script>
</body>
</html>
